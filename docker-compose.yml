services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nomorewaste}
    volumes:
      - db_data:/var/lib/mysql
      - ./api/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pnomorewaste"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nomorewaste}
      DB_NAME: no_more_waste
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-nomorewaste}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-projet.annuel42@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-wtwfapeaaevsowpr}
    ports:
      - "8082:8081"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8081
      API_PUBLIC_URL: http://localhost:8082
    ports:
      - "8090:80"

volumes:
  db_data:
